<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a0b2e">
<meta name="description" content="WordRain: catch falling Spanish and Chinese vocabulary before it lands.">
<title>WordRain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Colours and fonts come from the active theme (themes.js) via these variables. */
:root {
  --bg: #1a0b2e;
  --text: #fdf2ff;
  --muted: #c9b6e4;
  --accent: #ff3ea5;
  --accent2: #2de2e6;
  --correct: #3dff8a;
  --wrong: #ff4d4d;
  --btn: #2a1248;
  --btn-text: #fdf2ff;
  --btn-border: #2de2e6;
  --panel: rgba(16, 6, 32, 0.82);
  --font-display: "Press Start 2P", ui-monospace, monospace;
  --font-text: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans SC", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
  --gutter: 16px;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-text);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}

#scene {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  display: block;
}

#app {
  position: relative;
  z-index: 1;
  height: 100vh;
  height: 100dvh;
  width: 100%;
  max-width: 640px;
  margin: 0 auto;
  padding: max(var(--gutter), env(safe-area-inset-top)) var(--gutter) max(var(--gutter), env(safe-area-inset-bottom));
}

.screen {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.card {
  width: 100%;
  max-width: 520px;
  background: var(--panel);
  border: 2px solid var(--accent2);
  border-radius: 14px;
  box-shadow: 0 0 24px rgba(45, 226, 230, 0.25), inset 0 0 0 1px rgba(255, 255, 255, 0.04);
  padding: 28px 22px;
  text-align: center;
  max-height: 100%;
  overflow-y: auto;
}
.card.small { max-width: 320px; }

.title {
  font-family: var(--font-display);
  font-size: clamp(28px, 9vw, 48px);
  line-height: 1.2;
  margin: 4px 0 14px;
  color: var(--accent);
  text-shadow: 0 0 8px var(--accent), 3px 3px 0 var(--accent2);
  letter-spacing: 1px;
}
.tagline { color: var(--muted); margin: 0 0 22px; line-height: 1.6; }
.heading {
  font-family: var(--font-display);
  font-size: clamp(14px, 4.4vw, 20px);
  line-height: 1.5;
  margin: 0 0 20px;
  color: var(--accent2);
}
.muted { color: var(--muted); }
.label {
  display: block;
  text-align: left;
  font-size: 14px;
  color: var(--muted);
  margin: 0 0 6px;
}

input[type="text"], select {
  width: 100%;
  font: inherit;
  font-size: 18px;
  padding: 12px 14px;
  border-radius: 10px;
  border: 2px solid var(--accent2);
  background: rgba(0, 0, 0, 0.35);
  color: var(--text);
  margin-bottom: 18px;
  outline: none;
}
input[type="text"]:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255, 62, 165, 0.3); }

.btn {
  font: inherit;
  font-family: var(--font-display);
  font-size: 14px;
  line-height: 1.4;
  color: var(--btn-text);
  background: var(--btn);
  border: 2px solid var(--btn-border);
  border-radius: 10px;
  padding: 14px 18px;
  min-height: 52px;
  cursor: pointer;
  transition: transform 0.08s, box-shadow 0.15s, opacity 0.15s;
}
.btn:hover:not(:disabled) { box-shadow: 0 0 14px var(--btn-border); }
.btn:active:not(:disabled) { transform: translateY(2px); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn:focus-visible, .option:focus-visible, .icon-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #1a0b2e; width: 100%; }
.btn-primary:hover:not(:disabled) { box-shadow: 0 0 18px var(--accent); }
.btn-link {
  background: none;
  border: none;
  min-height: 44px;
  margin-top: 14px;
  font-size: 11px;
  color: var(--muted);
}

.choice-grid { display: grid; gap: 12px; grid-template-columns: 1fr; }
.choice-grid.two { grid-template-columns: 1fr 1fr; }
.btn-choice { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 18px 12px; }
.btn-choice .big { font-family: var(--font-text); font-size: 19px; font-weight: 700; }
.choice-grid.two .btn-choice .big { font-size: clamp(18px, 5vw, 24px); font-family: var(--font-display); }
.choice-grid.two .btn-choice .big[lang="zh-CN"] { font-family: var(--font-text); font-size: clamp(26px, 7vw, 34px); font-weight: 700; }
.btn-choice .sub { font-family: var(--font-text); font-size: 13px; color: var(--muted); }
@media (min-width: 520px) { .choice-grid:not(.two) { grid-template-columns: 1fr 1fr; } }
@media (max-width: 380px) { .choice-grid.two { grid-template-columns: 1fr; } }

.theme-picker { text-align: left; }

/* ---------- Play ---------- */
#screen-play { justify-content: flex-start; align-items: stretch; gap: 10px; }

.hud {
  background: var(--panel);
  border: 2px solid var(--accent2);
  border-radius: 12px;
  padding: 8px 12px;
  display: grid;
  gap: 6px;
  font-size: 14px;
}
.hud-row { display: flex; align-items: center; gap: 12px; min-height: 30px; }
.hud-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
.hud-time { font-family: var(--font-display); font-size: 12px; color: var(--accent2); }
.hud-buttons { display: flex; gap: 6px; }
.icon-btn {
  width: 40px; height: 40px;
  border-radius: 8px;
  border: 2px solid var(--btn-border);
  background: var(--btn);
  color: var(--btn-text);
  font-size: 15px;
  cursor: pointer;
  display: grid;
  place-items: center;
  padding: 0;
}
.icon-btn.muted { opacity: 0.55; text-decoration: line-through; }
.hud-stat { white-space: nowrap; }
.hud-stat b { font-family: var(--font-display); font-size: 13px; color: var(--accent); margin-left: 4px; }
.hud-label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
.hud-lives { margin-left: auto; display: flex; gap: 2px; font-size: 15px; letter-spacing: 0; }
.heart { color: var(--accent); text-shadow: 0 0 6px var(--accent); transition: transform 0.3s, opacity 0.3s; }
.heart.lost { color: var(--muted); opacity: 0.3; text-shadow: none; }
.heart.losing { animation: heart-lose 0.6s; }
@keyframes heart-lose { 0% { transform: scale(1); } 40% { transform: scale(1.8); color: var(--wrong); } 100% { transform: scale(1); } }

.field {
  position: relative;
  flex: 1;
  min-height: 160px;
  overflow: hidden;
  border-radius: 12px;
}
.ground {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 3px;
  background: var(--accent);
  box-shadow: 0 0 12px var(--accent);
  opacity: 0.7;
}
.mode-chip {
  position: absolute;
  top: 6px; right: 6px;
  font-family: var(--font-display);
  font-size: 9px;
  padding: 6px 8px;
  border-radius: 6px;
  background: var(--panel);
  color: var(--muted);
  z-index: 2;
}

.word {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  margin: 0 auto;
  width: fit-content;
  max-width: calc(100% - 16px);
  background: var(--panel);
  border: 2px solid var(--accent);
  border-radius: 12px;
  padding: 10px 18px;
  box-shadow: 0 0 18px rgba(255, 62, 165, 0.45);
  text-align: center;
  will-change: transform;
  z-index: 1;
}
.word-text { display: block; font-size: 26px; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
.word.hz .word-text { font-size: 40px; letter-spacing: 2px; }
.word.burst { animation: burst 0.35s ease-out forwards; }
.word.missed { border-color: var(--wrong); box-shadow: 0 0 18px var(--wrong); }
.word.gone { visibility: hidden; }
@keyframes burst { to { opacity: 0; filter: brightness(2); scale: 1.6; } }

.particles { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.particle {
  position: absolute;
  width: 8px; height: 8px;
  background: var(--c, var(--correct));
  box-shadow: 0 0 6px var(--c, var(--correct));
  animation: particle 0.6s ease-out forwards;
}
@keyframes particle { to { transform: translate(var(--dx), var(--dy)); opacity: 0; } }

.reveal {
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: min(92%, 420px);
  background: var(--panel);
  border: 2px solid var(--accent2);
  border-radius: 12px;
  padding: 12px 16px;
  text-align: center;
  z-index: 3;
  animation: pop 0.2s ease-out;
}
.reveal-hz { font-size: 40px; font-weight: 700; }
.reveal-py { font-size: 20px; color: var(--accent2); margin-top: 4px; }
.reveal-en { font-size: 17px; color: var(--text); margin-top: 4px; }
@keyframes pop { from { transform: translate(-50%, -50%) scale(0.85); opacity: 0; } }

.countdown {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-family: var(--font-display);
  font-size: 72px;
  color: var(--accent);
  text-shadow: 0 0 16px var(--accent), 4px 4px 0 var(--accent2);
  z-index: 4;
}
.countdown span { animation: count 1s ease-out; }
@keyframes count { from { transform: scale(1.8); opacity: 0; } 30% { opacity: 1; } }

.pause-overlay {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  background: rgba(0, 0, 0, 0.45);
  z-index: 5;
  padding: 12px;
}
.paused .word, .paused .reveal, .paused .options, .paused .countdown { visibility: hidden; }

.options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.option {
  position: relative;
  height: 84px;
  padding: 22px 8px 10px;
  border-radius: 12px;
  border: 2px solid var(--btn-border);
  background: var(--panel);
  color: var(--text);
  font: inherit;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  overflow: hidden;
  touch-action: manipulation;
  transition: background 0.12s, border-color 0.12s, box-shadow 0.12s;
}
.option:hover:not(:disabled) { box-shadow: 0 0 14px var(--btn-border); }
.option:disabled { cursor: default; }
.opt-text { display: block; width: 100%; font-size: 18px; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
.option.hz .opt-text { font-size: 26px; }
.key {
  position: absolute;
  top: 5px; left: 7px;
  font-family: var(--font-display);
  font-size: 8px;
  color: var(--muted);
  display: none;
}
@media (hover: hover) and (pointer: fine) { .key { display: block; } }
.option.correct { background: var(--correct); border-color: var(--correct); color: #08210f; box-shadow: 0 0 18px var(--correct); }
.option.wrong { background: var(--wrong); border-color: var(--wrong); color: #2a0606; box-shadow: 0 0 18px var(--wrong); animation: shake 0.3s; }
.option.correct .key, .option.wrong .key { color: inherit; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

/* Phones: options stack as full-width buttons within thumb reach. */
@media (max-width: 600px) {
  .options { grid-template-columns: 1fr; gap: 8px; }
  .option { height: 60px; padding: 6px 12px; }
  .opt-text { font-size: 17px; }
  .option.hz .opt-text { font-size: 24px; }
  .word-text { font-size: 22px; }
  .word.hz .word-text { font-size: 36px; }
  .key { top: 50%; transform: translateY(-50%); }
  .option .opt-text { padding: 0 34px; }
}

/* ---------- Results ---------- */
.result { padding: 18px 16px; }
.result .heading { margin-bottom: 12px; }
.share-preview {
  display: block;
  margin: 0 auto 14px;
  padding: 0;
  border: 2px solid var(--accent2);
  border-radius: 10px;
  background: #000;
  overflow: hidden;
  cursor: zoom-in;
  height: min(52vh, 520px);
  height: min(52dvh, 520px);
  aspect-ratio: 9 / 16;
}
.share-preview img { display: block; width: 100%; height: 100%; object-fit: contain; }
.result-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.result-actions .btn { width: 100%; min-width: 0; padding: 14px 6px; font-size: clamp(11px, 3.4vw, 14px); }
.result .heading { font-size: clamp(12px, 4vw, 20px); }
.small-print { font-size: 12px; margin: 10px 0 0; }

.fullscreen {
  position: fixed;
  inset: 0;
  z-index: 20;
  background: rgba(0, 0, 0, 0.94);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 16px;
  color: #fff;
  text-align: center;
}
.fullscreen img { max-width: 100%; max-height: calc(100% - 120px); -webkit-touch-callout: default; user-select: auto; }
.fullscreen p { margin: 0; font-size: 14px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>

<main id="app">
  <!-- 1. Welcome -->
  <section class="screen" id="screen-welcome" data-screen="welcome">
    <div class="card">
      <h1 class="title" data-game-title>WordRain</h1>
      <p class="tagline">Catch the word before it lands.<br><span lang="es">Español</span> · <span lang="zh-CN">中文</span></p>
      <form id="welcome-form" autocomplete="off">
        <label for="name" class="label">Your name</label>
        <input id="name" name="name" type="text" maxlength="16" required placeholder="Up to 16 characters" spellcheck="false" enterkeyhint="go">
        <div id="theme-picker" class="theme-picker" hidden>
          <label for="theme" class="label">Background</label>
          <select id="theme"></select>
        </div>
        <button type="submit" class="btn btn-primary" id="start-btn" disabled>Start</button>
      </form>
    </div>
  </section>

  <!-- 2. Language -->
  <section class="screen" id="screen-language" data-screen="language" hidden>
    <div class="card">
      <h2 class="heading">Choose a language</h2>
      <div class="choice-grid two">
        <button class="btn btn-choice" data-lang="es"><span class="big" lang="es">Español</span><span class="sub">Spanish ↔ English · <span data-count="es"></span> words</span></button>
        <button class="btn btn-choice" data-lang="zh"><span class="big" lang="zh-CN">中文</span><span class="sub">Simplified Chinese · HSK 4+ · <span data-count="zh"></span> words</span></button>
      </div>
      <button class="btn btn-link" data-back="welcome">← Back</button>
    </div>
  </section>

  <!-- 3. Mode (Chinese only) -->
  <section class="screen" id="screen-mode" data-screen="mode" hidden>
    <div class="card">
      <h2 class="heading">Choose a mode</h2>
      <div class="choice-grid">
        <button class="btn btn-choice" data-mode="cm"><span class="big">Character → Meaning</span><span class="sub"><span lang="zh-CN">汉字</span> → English</span></button>
        <button class="btn btn-choice" data-mode="cp"><span class="big">Character → Pinyin</span><span class="sub"><span lang="zh-CN">汉字</span> → pīnyīn</span></button>
        <button class="btn btn-choice" data-mode="mc"><span class="big">Meaning → Character</span><span class="sub">English → <span lang="zh-CN">汉字</span></span></button>
        <button class="btn btn-choice" data-mode="mix"><span class="big">Mix</span><span class="sub">All three, at random</span></button>
      </div>
      <button class="btn btn-link" data-back="language">← Back</button>
    </div>
  </section>

  <!-- 4. Play -->
  <section class="screen" id="screen-play" data-screen="play" hidden>
    <header class="hud">
      <div class="hud-row">
        <span class="hud-name" id="hud-name"></span>
        <span class="hud-time" id="hud-time" aria-label="Elapsed time">0:00</span>
        <div class="hud-buttons">
          <button class="icon-btn" id="mute-btn" aria-label="Mute sound" title="Mute">♪</button>
          <button class="icon-btn" id="pause-btn" aria-label="Pause (P)" title="Pause (P)">❚❚</button>
        </div>
      </div>
      <div class="hud-row">
        <span class="hud-stat"><span class="hud-label">Score</span> <b id="hud-score">0</b></span>
        <span class="hud-stat"><span class="hud-label">Level</span> <b id="hud-level">1</b></span>
        <span class="hud-lives" id="hud-lives" aria-label="Lives"></span>
      </div>
    </header>

    <div class="field" id="field">
      <div class="mode-chip" id="mode-chip"></div>
      <div class="word" id="word"><span class="word-text" id="word-text"></span></div>
      <div class="reveal" id="reveal" hidden>
        <div class="reveal-hz" id="reveal-hz" lang="zh-CN"></div>
        <div class="reveal-py" id="reveal-py"></div>
        <div class="reveal-en" id="reveal-en"></div>
      </div>
      <div class="particles" id="particles"></div>
      <div class="countdown" id="countdown" hidden></div>
      <div class="pause-overlay" id="pause-overlay" hidden>
        <div class="card small">
          <h2 class="heading">Paused</h2>
          <p class="muted">The word is hidden while paused.</p>
          <button class="btn btn-primary" id="resume-btn">Resume</button>
        </div>
      </div>
      <div class="ground" aria-hidden="true"></div>
    </div>

    <div class="options" id="options">
      <button class="option" data-opt="0"><span class="key">1 / A</span><span class="opt-text"></span></button>
      <button class="option" data-opt="1"><span class="key">2 / S</span><span class="opt-text"></span></button>
      <button class="option" data-opt="2"><span class="key">3 / D</span><span class="opt-text"></span></button>
    </div>
  </section>

  <!-- 5. Level up / 6. Game over (shared layout) -->
  <section class="screen" id="screen-result" data-screen="result" hidden>
    <div class="card result">
      <h2 class="heading" id="result-heading"></h2>
      <button class="share-preview" id="share-preview" aria-label="View share image full screen">
        <img id="share-img" alt="Share image with your score">
      </button>
      <div class="result-actions">
        <button class="btn" id="download-btn">Download</button>
        <button class="btn btn-primary" id="continue-btn">Continue</button>
      </div>
      <p class="muted small-print" id="result-hint"></p>
    </div>
  </section>
</main>

<div class="fullscreen" id="fullscreen" hidden>
  <img id="fullscreen-img" alt="Share image. Long-press to save.">
  <p>Long-press the image to save it, then share it.</p>
  <button class="btn" id="fullscreen-close">Close</button>
</div>

<script>
/*
 * WordRain themes.
 *
 * Each theme is one self-contained block in the THEMES list. The game reads
 * only the fields below, so adding or swapping a theme needs no change to
 * the game logic. When THEMES holds two or more entries, a picker appears on
 * the Welcome screen automatically.
 *
 *   id, name   Identifier and the label shown in the theme picker.
 *   palette    Colours for the background, text, accent, correct, wrong
 *              and buttons. `panel` is the solid or dimmed backing behind
 *              the falling word and options, which keeps them readable.
 *   fonts      `display` for titles and scores, `text` for words. The text
 *              font must cover Spanish accents and Chinese characters.
 *              `load` lists fonts to wait for before drawing a share image.
 *   scene      The animated play background: draw(ctx, w, h, timeSeconds).
 *              Or give `image: "url-or-data-uri"` instead of a drawn scene.

 *              drawBackground(ctx, W, H) plus colours for the content.

 *
 *   {
 *     id: "night-city",

 *     fonts: { display: "...", text: "..." },
 *     image: "data:image/jpeg;base64,...",   // or "backgrounds/city.jpg"

/* ---------- Retro Sunset ---------- */

const retroSunset = (() => {
  // Fixed star field so the sky does not jump between frames.
  const stars = [];

  const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

    let i = 0;
    while (y < cy + r) {
      const gap = Math.max(1, band * (0.12 + 0.11 * i));
      ctx.fillRect(cx - r, y, r * 2, band - gap);
      y += band;
      i++;
    }
    ctx.restore();

    // Mountains
    ctx.beginPath();
    ctx.moveTo(0, horizon);
    for (let m = 0; m < mountains.length; m += 2) {
      ctx.lineTo(mountains[m] * w, horizon - mountains[m + 1] * unit * 0.12);
    }
    ctx.lineTo(w, horizon);
    ctx.closePath();
    ctx.fillStyle = "#1b0633";
    ctx.fill();
    ctx.strokeStyle = "rgba(45,226,230,0.55)";
    ctx.lineWidth = Math.max(1, unit / 400);
    ctx.stroke();

    // Ground
    const ground = ctx.createLinearGradient(0, horizon, 0, h);
    ground.addColorStop(0, "#1a0533");
    ground.addColorStop(1, "#090014");
    ctx.fillStyle = ground;
    ctx.fillRect(0, horizon, w, h - horizon);

    // Perspective grid scrolling toward the player
    const gh = h - horizon;
    const lw = Math.max(1, unit / 360);
    ctx.lineWidth = lw;
    ctx.strokeStyle = "rgba(255,62,165,0.85)";
    const phase = (t * 0.9) % 1;
    ctx.beginPath();
    for (let k = 1; k < 40; k++) {
      const z = k - phase;
      if (z < 0.6) continue;
      const yy = horizon + gh * (0.6 / z);
      if (yy > h) continue;
      ctx.moveTo(0, yy);
      ctx.lineTo(w, yy);
    }
    ctx.stroke();

    ctx.strokeStyle = "rgba(45,226,230,0.75)";
    ctx.beginPath();
    const spread = w * 0.11;
    for (let k = -18; k <= 18; k++) {
      ctx.moveTo(cx + k * spread * 0.12, horizon);
      ctx.lineTo(cx + k * spread * 1.6, h);
    }
    ctx.stroke();

    // Horizon glow
    const glow = ctx.createLinearGradient(0, horizon - 6, 0, horizon + unit * 0.05);
    glow.addColorStop(0, "rgba(255,62,165,0.9)");
    glow.addColorStop(1, "rgba(255,62,165,0)");
    ctx.fillStyle = glow;
    ctx.fillRect(0, horizon - 2, w, unit * 0.05);

    // CRT scan lines
    ctx.fillStyle = "rgba(0,0,0,0.16)";
    const step = Math.max(3, Math.round(unit / 220));
    for (let sy = 0; sy < h; sy += step) ctx.fillRect(0, sy, w, 1);
  }

  return {
    id: "retro-sunset",
    name: "Retro Sunset",
    palette: {
      bg: "#1a0b2e",
      text: "#fdf2ff",
      muted: "#c9b6e4",
      accent: "#ff3ea5",
      accent2: "#2de2e6",
      correct: "#3dff8a",
      wrong: "#ff4d4d",
      btn: "#2a1248",
      btnText: "#fdf2ff",
      btnBorder: "#2de2e6",
      panel: "rgba(16, 6, 32, 0.84)",
    },
    fonts: {
      display: '"Press Start 2P", ui-monospace, monospace',
      text: TEXT_FONT,
      load: ['32px "Press Start 2P"'],
    },
    scene: { draw },
    card: {
      drawBackground(ctx, W, H) {
        draw(ctx, W, H, 0.35, { horizon: 0.7 });
      },
      panel: "rgba(13, 2, 33, 0.80)",
      border: "#2de2e6",
      title: "#ff3ea5",
      titleShadow: "#2de2e6",
      score: "#ffe66d",
      text: "#fdf2ff",
      muted: "#c9b6e4",
      accent: "#2de2e6",
      glow: "#ff3ea5",
    },
  };
})();

<script>
"use strict";

/* ======================================================================
 * WordRain: game logic. Word lists come from VOCAB (built from the PDFs),
 * looks come from THEMES (themes.js).
 * ====================================================================== */

const GAME_TITLE = "WordRain";

const CONFIG = {
  lives: 7,
  pointsPerCorrect: 5,
  pointsPerLevel: 250,
  fallStartSeconds: 8,
  fallStepSeconds: 0.5,
  fallMinSeconds: 3.5,
  correctPauseMs: 450, // Spanish: word bursts, next word drops
  revealCorrectMs: 1300, // Chinese: full entry shown after a correct answer
  showAnswerMs: 1200, // wrong or missed: correct option shows green
  revealMissMs: 1800, // Chinese wrong or missed: green option plus the full entry
  countdownSeconds: 3,
};

const fallSeconds = (level) =>
  Math.max(CONFIG.fallMinSeconds, CONFIG.fallStartSeconds - CONFIG.fallStepSeconds * (level - 1));

/* ---------------------------------------------------------------- data */

function normalise(s) {
  return s.toLowerCase().replace(/\([^)]*\)/g, " ").replace(/\s+/g, " ").trim();
}
function meaningParts(s) {
  return new Set(normalise(s).split(/\s*[\/,;]\s*/).map((x) => x.trim()).filter(Boolean));
}
function overlaps(a, b) {
  for (const x of a) if (b.has(x)) return true;
  return false;
}
function syllableCount(hz, py) {
  let n = [...hz].length;
  // Erhua: 儿 merges into the previous syllable ("nǎr") unless written out ("nǚér").
  if (n > 1 && hz.endsWith("儿") && /r$/.test(py) && !/[eéèěē]r$/.test(py)) n--;
  return n;
}

const LANGS = {
  es: {
    entries: VOCAB.es.entries.map(([es, en, topic], id) => ({
      id, es, en, topic, esKey: normalise(es), enParts: meaningParts(en),
    })),
    topics: VOCAB.es.topics,
  },
  zh: {
    entries: VOCAB.zh.entries.map(([hz, py, en, topic], id) => ({
      id, hz, py, en, topic,
      pyKey: py.replace(/\s+/g, "").toLowerCase(),
      enParts: meaningParts(en),
      chars: [...hz].length,
      syllables: syllableCount(hz, py),
    })),
    topics: VOCAB.zh.topics,
  },
};
for (const lang of Object.values(LANGS)) {
  lang.byTopic = lang.topics.map(() => []);
  for (const e of lang.entries) lang.byTopic[e.topic].push(e);
}

/* What falls and what the options show, per question mode. */
const MODES = {
  es2en: { lang: "es", chip: "ES → EN", prompt: (e) => e.es, option: (e) => e.en, promptLang: "es", optionLang: "en" },
  en2es: { lang: "es", chip: "EN → ES", prompt: (e) => e.en, option: (e) => e.es, promptLang: "en", optionLang: "es" },
  cm: { lang: "zh", chip: "汉字 → EN", prompt: (e) => e.hz, option: (e) => e.en, promptLang: "zh-CN", optionLang: "en", hzPrompt: true },
  cp: { lang: "zh", chip: "汉字 → PINYIN", prompt: (e) => e.hz, option: (e) => e.py, promptLang: "zh-CN", optionLang: "zh-Latn-pinyin", hzPrompt: true,
    same: (a, b) => a.syllables === b.syllables },
  mc: { lang: "zh", chip: "EN → 汉字", prompt: (e) => e.en, option: (e) => e.hz, promptLang: "en", optionLang: "zh-CN", hzOptions: true,
    same: (a, b) => a.chars === b.chars },
};

/* Two entries clash when one could pass for a right answer to the other. */
function clashes(a, b, mode) {
  if (a === b) return true;
  if (overlaps(a.enParts, b.enParts)) return true;
  if (MODES[mode].lang === "es") return a.esKey === b.esKey;
  return a.hz === b.hz || (mode === "cp" && a.pyKey === b.pyKey);
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function pickWrongOptions(target, mode) {
  const lang = LANGS[MODES[mode].lang];
  const shape = MODES[mode].same || (() => true);
  const optText = MODES[mode].option;
  const picked = [];
  const fits = (c, strictShape) =>
    !clashes(target, c, mode) &&
    (!strictShape || shape(target, c)) &&
    picked.every((p) => p !== c && optText(p) !== optText(c));

  // 1) same topic, 2) whole list, 3) whole list without the length rule.
  const topicPool = shuffle(lang.byTopic[target.topic].slice());
  for (const c of topicPool) {
    if (picked.length === 2) break;
    if (fits(c, true)) picked.push(c);
  }
  for (let tries = 0; picked.length < 2 && tries < 600; tries++) {
    const c = lang.entries[Math.floor(Math.random() * lang.entries.length)];
    if (fits(c, true)) picked.push(c);
  }
  if (picked.length < 2) {
    for (const c of shuffle(lang.entries.slice())) {
      if (picked.length === 2) break;
      if (fits(c, false)) picked.push(c);
    }
  }
  return picked;
}

function buildQuestion(entry, mode) {
  const wrong = pickWrongOptions(entry, mode);
  const options = shuffle([entry, ...wrong]);
  return {
    entry,
    mode,
    prompt: MODES[mode].prompt(entry),
    options: options.map((e) => MODES[mode].option(e)),
    correct: options.indexOf(entry),
  };
}

/* ---------------------------------------------------------------- text */

const COPY = {

const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const formatTime = (ms) => {
  const s = Math.floor(ms / 1000);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
};
const isoDate = (d) =>
  `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

/* ---------------------------------------------------------------- sound */

const Sound = {
  ctx: null,
  muted: false,
  ensure() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
  },
  beep(freq, dur, { type = "square", at = 0, vol = 0.07, slide = 0 } = {}) {
    if (this.muted || !this.ctx) return;
    const t = this.ctx.currentTime + at;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.linearRampToValueAtTime(freq + slide, t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(this.ctx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  },
  correct() { this.beep(660, 0.07); this.beep(990, 0.12, { at: 0.07 }); },
  wrong() { this.beep(220, 0.28, { type: "sawtooth", slide: -90, vol: 0.06 }); },
  tick() { this.beep(440, 0.1); },
  go() { this.beep(880, 0.18); },
  levelUp() { [523, 659, 784, 1047].forEach((f, i) => this.beep(f, 0.14, { at: i * 0.11 })); },
  gameOver() { [392, 330, 262, 196].forEach((f, i) => this.beep(f, 0.2, { at: i * 0.16, type: "triangle", vol: 0.09 })); },
};

/* ---------------------------------------------------------------- dom */

const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => [...document.querySelectorAll(sel)];
const el = {
  scene: $("#scene"),
  nameInput: $("#name"),
  startBtn: $("#start-btn"),
  themePicker: $("#theme-picker"),
  themeSelect: $("#theme"),
  play: $("#screen-play"),
  field: $("#field"),
  word: $("#word"),
  wordText: $("#word-text"),
  modeChip: $("#mode-chip"),
  reveal: $("#reveal"),
  revealHz: $("#reveal-hz"),
  revealPy: $("#reveal-py"),
  revealEn: $("#reveal-en"),
  particles: $("#particles"),
  countdown: $("#countdown"),
  pauseOverlay: $("#pause-overlay"),
  options: $$(".option"),
  optionTexts: $$(".option .opt-text"),
  hudName: $("#hud-name"),
  hudScore: $("#hud-score"),
  hudLevel: $("#hud-level"),
  hudLives: $("#hud-lives"),
  hudTime: $("#hud-time"),
  pauseBtn: $("#pause-btn"),
  muteBtn: $("#mute-btn"),
  resultHeading: $("#result-heading"),
  shareImg: $("#share-img"),
  sharePreview: $("#share-preview"),
  downloadBtn: $("#download-btn"),
  continueBtn: $("#continue-btn"),
  resultHint: $("#result-hint"),
  fullscreen: $("#fullscreen"),
  fullscreenImg: $("#fullscreen-img"),
};

/* ---------------------------------------------------------------- theme */

let theme = THEMES[0];
let themeImage = null;

function applyTheme(t) {
  theme = t;
  const p = t.palette;
  const vars = {
    "--bg": p.bg, "--text": p.text, "--muted": p.muted, "--accent": p.accent, "--accent2": p.accent2,
    "--correct": p.correct, "--wrong": p.wrong, "--btn": p.btn, "--btn-text": p.btnText,
    "--btn-border": p.btnBorder || p.accent2, "--panel": p.panel,
    "--font-display": t.fonts.display, "--font-text": t.fonts.text,
  };
  for (const [k, v] of Object.entries(vars)) if (v) document.documentElement.style.setProperty(k, v);
  document.querySelector('meta[name="theme-color"]').setAttribute("content", p.bg);
  themeImage = null;
  if (t.image) {
    const img = new Image();
    img.onload = () => { themeImage = img; sceneDirty = true; };
    img.src = t.image;
  }
  sceneDirty = true;
}

function drawImageCover(ctx, img, w, h) {
  const s = Math.max(w / img.width, h / img.height);
  const iw = img.width * s;
  const ih = img.height * s;
  ctx.drawImage(img, (w - iw) / 2, (h - ih) / 2, iw, ih);
}

function drawThemeScene(ctx, w, h, t) {
  if (theme.image) {
    ctx.fillStyle = theme.palette.bg;
    ctx.fillRect(0, 0, w, h);
    if (themeImage) drawImageCover(ctx, themeImage, w, h);
  } else {
    theme.scene.draw(ctx, w, h, t);
  }
}

/* Background canvas */
const sceneCtx = el.scene.getContext("2d");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
let sceneDirty = true;
let sceneW = 0;

function resizeScene() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  sceneW = window.innerWidth;
  sceneH = window.innerHeight;
  el.scene.width = Math.round(sceneW * dpr);
  el.scene.height = Math.round(sceneH * dpr);
  sceneCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sceneDirty = true;
}
window.addEventListener("resize", () => { resizeScene(); fitAll(); });

/* ---------------------------------------------------------------- state */

const g = {
  screen: "welcome",
  name: "",
  lang: "es",
  zhMode: "cm",
  score: 0,
  lives: CONFIG.lives,
  level: 1,
  correct: 0,
  answered: 0,
  elapsed: 0,
  deck: [],
  deckPos: 0,
  q: null,
  phase: "idle", // countdown | falling | feedback | result
  paused: false,
  fallT: 0,
  fallDur: 8,
  feedbackLeft: 0,
  countdownLeft: 0,
  countdownShown: 0,
  resultKind: null,
  cardBlob: null,
  cardUrl: null,
};

function showScreen(name) {
  g.screen = name;
  for (const s of $$(".screen")) s.hidden = s.dataset.screen !== name;
  const focusTarget = {
    welcome: el.nameInput,
    language: $('[data-lang="es"]'),
    mode: $('[data-mode="cm"]'),
    result: el.continueBtn,
  }[name];
  if (focusTarget && matchMedia("(pointer: fine)").matches) focusTarget.focus({ preventScroll: true });
}

/* ---------------------------------------------------------------- flow */

function startGame(lang, zhMode) {
  Sound.ensure();
  Object.assign(g, {
    lang, zhMode: zhMode || g.zhMode,
    score: 0, lives: CONFIG.lives, level: 1, correct: 0, answered: 0, elapsed: 0,
    deck: shuffle(LANGS[lang].entries.map((e) => e.id)), deckPos: 0,
    q: null, paused: false,
  });
  el.hudName.textContent = g.name;
  renderHud(true);
  clearWord();
  showScreen("play");
  startCountdown();
}

function startCountdown() {
  g.phase = "countdown";
  g.countdownLeft = CONFIG.countdownSeconds * 1000;
  g.countdownShown = 0;
  el.countdown.hidden = false;
  clearWord();
}

function nextEntry() {
  if (g.deckPos >= g.deck.length) {
    // Whole list used: reshuffle, avoiding an immediate repeat of the last word.
    const last = g.deck[g.deck.length - 1];
    g.deck = shuffle(g.deck);
    if (g.deck[0] === last && g.deck.length > 1) [g.deck[0], g.deck[1]] = [g.deck[1], g.deck[0]];
    g.deckPos = 0;
  }
  return LANGS[g.lang].entries[g.deck[g.deckPos++]];
}

function nextMode() {
  if (g.lang === "es") return Math.random() < 0.5 ? "es2en" : "en2es";
  if (g.zhMode === "mix") return pick(["cm", "cp", "mc"]);
  return g.zhMode;
}

function nextWord() {
  const q = buildQuestion(nextEntry(), nextMode());
  g.q = q;
  const m = MODES[q.mode];

  el.modeChip.textContent = m.chip;
  el.reveal.hidden = true;
  el.word.className = "word" + (m.hzPrompt ? " hz" : "");
  el.wordText.textContent = q.prompt;
  el.wordText.lang = m.promptLang;
  el.options.forEach((b, i) => {
    b.className = "option" + (m.hzOptions ? " hz" : "");
    b.disabled = false;
    el.optionTexts[i].textContent = q.options[i];
    el.optionTexts[i].lang = m.optionLang;
  });
  fitAll();

  g.fallT = 0;
  g.fallDur = fallSeconds(g.level);
  positionWord(0);
  g.phase = "falling";
}

function clearWord() {
  el.word.className = "word gone";
  el.reveal.hidden = true;
  el.modeChip.textContent = "";
  el.options.forEach((b, i) => {
    b.className = "option";
    b.disabled = true;
    el.optionTexts[i].textContent = "";
  });
}

function positionWord(progress) {
  const maxY = Math.max(0, el.field.clientHeight - el.word.offsetHeight - 6);
  el.word.style.transform = `translateY(${Math.round(progress * maxY)}px)`;
}

function choose(i) {
  if (g.screen !== "play" || g.paused || g.phase !== "falling") return;
  Sound.ensure();
  const q = g.q;
  g.answered++;
  el.options.forEach((b) => (b.disabled = true));
  if (i === q.correct) {
    g.score += CONFIG.pointsPerCorrect;
    g.correct++;
    el.options[i].classList.add("correct");
    burst();
    Sound.correct();
    endWord(g.lang === "zh" ? CONFIG.revealCorrectMs : CONFIG.correctPauseMs);
  } else {
    el.options[i].classList.add("wrong");
    el.options[q.correct].classList.add("correct");
    loseLife();
    endWord(g.lang === "zh" ? CONFIG.revealMissMs : CONFIG.showAnswerMs);
  }
  renderHud();
}

function missed() {
  g.answered++;
  el.word.classList.add("missed");
  el.options.forEach((b) => (b.disabled = true));
  el.options[g.q.correct].classList.add("correct");
  loseLife();
  renderHud();
  endWord(g.lang === "zh" ? CONFIG.revealMissMs : CONFIG.showAnswerMs);
}

function loseLife() {
  g.lives--;
  Sound.wrong();
  const heart = el.hudLives.children[g.lives];
  if (heart) {
    heart.classList.add("losing");
    setTimeout(() => heart.classList.remove("losing"), 650);
  }
}

function endWord(ms) {
  g.phase = "feedback";
  g.feedbackLeft = ms;
  if (g.lang === "zh") {
    const e = g.q.entry;
    el.revealHz.textContent = e.hz;
    el.revealPy.textContent = e.py;
    el.revealEn.textContent = e.en;
    el.reveal.hidden = false;
    if (!el.word.classList.contains("burst")) el.word.classList.add("gone");
  }
}

function afterFeedback() {
  if (g.lives <= 0) return finish("over");
  if (g.score >= g.level * CONFIG.pointsPerLevel) return finish("level");
  nextWord();
}

function burst() {
  el.word.classList.add("burst");
  const fr = el.field.getBoundingClientRect();
  const wr = el.word.getBoundingClientRect();
  const cx = wr.left + wr.width / 2 - fr.left;
  const cy = wr.top + wr.height / 2 - fr.top;
  const colours = [theme.palette.correct, theme.palette.accent, theme.palette.accent2];
  for (let i = 0; i < 16; i++) {
    const p = document.createElement("i");
    p.className = "particle";
    const a = (i / 16) * Math.PI * 2;
    const d = 50 + Math.random() * 70;
    p.style.left = `${cx}px`;
    p.style.top = `${cy}px`;
    p.style.setProperty("--dx", `${Math.cos(a) * d}px`);
    p.style.setProperty("--dy", `${Math.sin(a) * d}px`);
    p.style.setProperty("--c", colours[i % 3]);
    el.particles.appendChild(p);
    setTimeout(() => p.remove(), 650);
  }
}

function finish(kind) {
  g.phase = "result";
  g.resultKind = kind;
  if (kind === "level") Sound.levelUp();
  else Sound.gameOver();
  clearWord();
  showResult(kind);
}

function continueFromResult() {
  if (g.screen !== "result") return;
  if (g.resultKind === "level") {
    g.level++;
    renderHud();
    showScreen("play");
    startCountdown();
  } else {
    showScreen("language");
  }
}

/* ---------------------------------------------------------------- pause */

function setPaused(on) {
  if (g.screen !== "play" || g.phase === "result") return;
  g.paused = on;
  el.play.classList.toggle("paused", on);
  el.pauseOverlay.hidden = !on;
  el.pauseBtn.textContent = on ? "▶" : "❚❚";
  el.pauseBtn.setAttribute("aria-label", on ? "Resume (P)" : "Pause (P)");
  if (on) $("#resume-btn").focus({ preventScroll: true });
  else if (document.activeElement) document.activeElement.blur();
}

/* ---------------------------------------------------------------- hud */

function renderHud(rebuildHearts) {
  el.hudScore.textContent = g.score;
  el.hudLevel.textContent = g.level;
  el.hudTime.textContent = formatTime(g.elapsed);
  if (rebuildHearts || el.hudLives.children.length !== CONFIG.lives) {
    el.hudLives.innerHTML = "";
    for (let i = 0; i < CONFIG.lives; i++) {
      const h = document.createElement("span");
      h.className = "heart";
      h.textContent = "♥";
      el.hudLives.appendChild(h);
    }
  }
  [...el.hudLives.children].forEach((h, i) => h.classList.toggle("lost", i >= g.lives));
  el.hudLives.setAttribute("aria-label", `${g.lives} of ${CONFIG.lives} lives`);
}

/* Shrink long text so nothing is cut off. */
function fitText(node, maxPx, minPx, maxHeight) {
  let size = maxPx;
  node.style.fontSize = `${size}px`;
  const tooBig = () =>
    node.scrollWidth > node.clientWidth + 1 || node.scrollHeight > maxHeight() + 1;
  while (size > minPx && tooBig()) {
    size -= 1;
    node.style.fontSize = `${size}px`;
  }
}

function fitAll() {
  if (!g.q || g.screen !== "play") return;
  const phone = matchMedia("(max-width: 600px)").matches;
  const m = MODES[g.q.mode];
  const wordMax = m.hzPrompt ? (phone ? 36 : 40) : (phone ? 22 : 26);
  fitText(el.wordText, wordMax, 12, () => wordMax * 1.25 * (m.hzPrompt ? 1 : 3));
  const optMax = m.hzOptions ? (phone ? 24 : 26) : (phone ? 17 : 18);
  el.optionTexts.forEach((t) => {
    const btn = t.parentElement;
    const cs = getComputedStyle(btn);
    const avail = () => btn.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    fitText(t, optMax, 10, avail);
  });
}

/* ---------------------------------------------------------------- loop */

let last = performance.now();
function frame(now) {
  const dt = Math.min(100, now - last);
  last = now;

  if (!reduceMotion || sceneDirty) {
    drawThemeScene(sceneCtx, sceneW, sceneH, reduceMotion ? 0 : now / 1000);
    sceneDirty = false;
  }

  if (g.screen === "play" && !g.paused) tick(dt);
  requestAnimationFrame(frame);
}

function tick(dt) {
  if (g.phase === "countdown") {
    g.countdownLeft -= dt;
    const n = Math.ceil(g.countdownLeft / 1000);
    if (n !== g.countdownShown && n > 0) {
      g.countdownShown = n;
      el.countdown.innerHTML = `<span>${n}</span>`;
      Sound.tick();
    }
    if (g.countdownLeft <= 0) {
      el.countdown.hidden = true;
      Sound.go();
      nextWord();
    }
    return;
  }
  if (g.phase === "falling") {
    g.elapsed += dt;
    g.fallT += dt;
    const p = Math.min(1, g.fallT / (g.fallDur * 1000));
    positionWord(p);
    if (p >= 1) missed();
  } else if (g.phase === "feedback") {
    g.elapsed += dt;
    g.feedbackLeft -= dt;
    if (g.feedbackLeft <= 0) afterFeedback();
  }
  el.hudTime.textContent = formatTime(g.elapsed);
}

/* ---------------------------------------------------------------- share image */

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function fitFont(ctx, text, font, size, maxW, min = 16) {
  while (size > min) {
    ctx.font = font(size);
    if (ctx.measureText(text).width <= maxW) break;
    size -= 2;
  }
  ctx.font = font(size);
  return size;
}

function wrapLines(ctx, text, maxW) {
  const cjk = /[　-鿿＀-￯]/.test(text);
  const tokens = cjk ? [...text] : text.split(" ");
  const sep = cjk ? "" : " ";
  const lines = [];
  let line = "";
  for (const tok of tokens) {
    const tryLine = line ? line + sep + tok : tok;
    if (ctx.measureText(tryLine).width > maxW && line) {
      lines.push(line);
      line = tok;
    } else {
      line = tryLine;
    }
  }
  if (line) lines.push(line);
  return lines;
}

async function waitForFonts() {
  const loads = (theme.fonts.load || []).map((f) => document.fonts.load(f).catch(() => null));
  await Promise.race([Promise.all(loads), new Promise((r) => setTimeout(r, 1500))]);
}

async function drawShareCard(kind) {
  await waitForFonts();
  const W = 1080;
  const H = 1920;
  const canvas = document.createElement("canvas");
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext("2d");
  const c = theme.card;
  const copy = COPY[g.lang];
  const display = (px) => `${px}px ${theme.fonts.display}`;
  const text = (px, weight = 400) => `${weight} ${px}px ${theme.fonts.text}`;
  const cx = W / 2;

  // Background in the current theme
  if (theme.image) {
    ctx.fillStyle = theme.palette.bg;
    ctx.fillRect(0, 0, W, H);
    if (themeImage) drawImageCover(ctx, themeImage, W, H);
  } else {
    c.drawBackground(ctx, W, H);
  }

  // Dimmed panel keeps every line readable
  roundRect(ctx, 64, 120, W - 128, H - 240, 36);
  ctx.fillStyle = c.panel;
  ctx.fill();
  ctx.lineWidth = 6;
  ctx.strokeStyle = c.border || c.accent;
  ctx.stroke();

  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";
  const maxW = W - 220;

  // 1. Title and language
  fitFont(ctx, GAME_TITLE, display, 88, maxW);
  if (c.titleShadow) {
    ctx.fillStyle = c.titleShadow;
    ctx.fillText(GAME_TITLE, cx + 6, 290 + 6);
  }
  ctx.fillStyle = c.title;
  ctx.fillText(GAME_TITLE, cx, 290);

  const langLine = g.lang === "zh" ? `${copy.language} · ${copy.modes[g.zhMode]}` : copy.language;
  ctx.font = text(46, 600);
  ctx.fillStyle = c.accent;
  ctx.fillText(langLine, cx, 390);

  // 2. Headline in the chosen language
  const headline = kind === "level" ? copy.levelDone(g.level) : copy.gameOver;
  ctx.fillStyle = c.text;
  if (g.lang === "zh") fitFont(ctx, headline, (px) => text(px, 800), 96, maxW);
  else fitFont(ctx, headline, display, 56, maxW);
  ctx.fillText(headline, cx, 540);

  // 3. Player name
  fitFont(ctx, g.name, (px) => text(px, 700), 68, maxW);
  ctx.fillStyle = c.text;
  ctx.fillText(g.name, cx, 680);

  // 4. Score: the largest element
  ctx.font = text(40, 600);
  ctx.fillStyle = c.muted;
  ctx.fillText(copy.score.toUpperCase(), cx, 790);
  fitFont(ctx, String(g.score), display, 230, maxW);
  ctx.save();
  ctx.shadowColor = c.glow || c.score;
  ctx.shadowBlur = 40;
  ctx.fillStyle = c.score;
  ctx.fillText(String(g.score), cx, 1040);
  ctx.restore();

  // 5. Stats, two by two
  const accuracy = g.answered ? Math.min(100, Math.round((g.correct / g.answered) * 100)) : 0;
  const stats = [
    [copy.level, String(g.level)],
    [copy.time, formatTime(g.elapsed)],
    [copy.correct, `${g.correct} · ${accuracy}%`],
    [copy.lives, `${Math.max(0, g.lives)}/${CONFIG.lives}`],
  ];
  const colW = (W - 200) / 2;
  stats.forEach(([label, value], i) => {
    const x = 100 + colW * (i % 2) + colW / 2;
    const y = 1170 + Math.floor(i / 2) * 190;
    roundRect(ctx, x - colW / 2 + 12, y - 70, colW - 24, 160, 22);
    ctx.fillStyle = "rgba(255,255,255,0.06)";
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = c.accent;
    ctx.stroke();
    fitFont(ctx, value, display, 50, colW - 70);
    ctx.fillStyle = c.text;
    ctx.fillText(value, x, y + 10);
    fitFont(ctx, label, (px) => text(px, 600), 32, colW - 70);
    ctx.fillStyle = c.muted;
    ctx.fillText(label, x, y + 66);
  });

  // 6. Motivational line
  const line = pick(kind === "level" ? copy.keepGoing : copy.tryAgain);
  ctx.font = text(52, 700);
  ctx.fillStyle = c.accent;
  const lines = wrapLines(ctx, line, maxW).slice(0, 3);
  lines.forEach((l, i) => ctx.fillText(l, cx, 1580 + i * 66 - (lines.length - 1) * 33));

  // 7. Day and date
  ctx.font = text(38, 500);
  ctx.fillStyle = c.muted;
  ctx.fillText(copy.date(new Date()), cx, 1730);

  return new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
}

async function showResult(kind) {
  const copy = { level: `Level ${g.level} complete!`, over: "Game over" };
  el.resultHeading.textContent = copy[kind];
  el.continueBtn.textContent = kind === "level" ? "Continue" : "Play again";
  el.resultHint.textContent =
    kind === "level"
      ? `Next: level ${g.level + 1}. Words fall a little faster.`
      : `Score ${g.score} · ${g.correct} correct · ${formatTime(g.elapsed)}`;
  el.downloadBtn.disabled = true;
  el.shareImg.removeAttribute("src");
  if (g.cardUrl) URL.revokeObjectURL(g.cardUrl);
  g.cardBlob = null;
  g.cardUrl = null;
  showScreen("result");

  const blob = await drawShareCard(kind);
  g.cardBlob = blob;
  g.cardUrl = URL.createObjectURL(blob);
  el.shareImg.src = g.cardUrl;
  el.downloadBtn.disabled = false;
}

function cardFileName() {
  const slug = g.name.normalize("NFKC").replace(/[^\p{L}\p{N}]+/gu, "-").replace(/^-|-$/g, "") || "player";
  return `wordrain-${slug}-${g.score}-${isoDate(new Date())}.png`;
}

const inAppBrowser = /Instagram|FBAN|FBAV|Line\/|Twitter|Snapchat/i.test(navigator.userAgent);

async function downloadCard() {
  if (!g.cardBlob) return;
  const name = cardFileName();
  const file = new File([g.cardBlob], name, { type: "image/png" });
  const phone = matchMedia("(pointer: coarse)").matches;

  if (phone && navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: GAME_TITLE });
      return;
    } catch (err) {
      if (err && err.name === "AbortError") return;
    }
  }
  const a = document.createElement("a");
  if ("download" in a && !inAppBrowser) {
    a.href = g.cardUrl;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    return;
  }
  openFullscreen();
}

function openFullscreen() {
  if (!g.cardUrl) return;
  el.fullscreenImg.src = g.cardUrl;
  el.fullscreen.hidden = false;
  $("#fullscreen-close").focus({ preventScroll: true });
}
function closeFullscreen() {
  el.fullscreen.hidden = true;
  if (g.screen === "result") el.continueBtn.focus({ preventScroll: true });
}

/* ---------------------------------------------------------------- input */

el.nameInput.addEventListener("input", () => {
  el.startBtn.disabled = el.nameInput.value.trim().length === 0;
});
$("#welcome-form").addEventListener("submit", (e) => {
  e.preventDefault();
  const name = el.nameInput.value.trim().slice(0, 16);
  if (!name) return;
  g.name = name;
  Sound.ensure();
  el.nameInput.blur();
  showScreen("language");
});

$$("[data-lang]").forEach((b) =>
  b.addEventListener("click", () => {
    if (b.dataset.lang === "es") startGame("es");
    else showScreen("mode");
  }),
);
$$("[data-mode]").forEach((b) => b.addEventListener("click", () => startGame("zh", b.dataset.mode)));
$$("[data-back]").forEach((b) => b.addEventListener("click", () => showScreen(b.dataset.back)));

el.options.forEach((b, i) =>
  b.addEventListener("click", () => {
    b.blur();
    choose(i);
  }),
);
el.pauseBtn.addEventListener("click", () => setPaused(!g.paused));
$("#resume-btn").addEventListener("click", () => setPaused(false));
el.muteBtn.addEventListener("click", () => {
  Sound.muted = !Sound.muted;
  el.muteBtn.classList.toggle("muted", Sound.muted);
  el.muteBtn.setAttribute("aria-label", Sound.muted ? "Unmute sound" : "Mute sound");
  el.muteBtn.blur();
});
el.downloadBtn.addEventListener("click", async () => {
  await downloadCard();
  // Keep Enter / Space mapped to Continue after a download.
  if (el.fullscreen.hidden && g.screen === "result") el.continueBtn.focus({ preventScroll: true });
});
el.continueBtn.addEventListener("click", continueFromResult);
el.sharePreview.addEventListener("click", openFullscreen);
$("#fullscreen-close").addEventListener("click", closeFullscreen);

const KEY_OPTION = { 1: 0, a: 0, 2: 1, s: 1, 3: 2, d: 2 };

document.addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  const confirmKey = k === "Enter" || k === " ";

  if (!el.fullscreen.hidden) {
    if (confirmKey || k === "Escape") {
      e.preventDefault();
      closeFullscreen();
    }
    return;
  }

  if (g.screen === "play") {
    if (k === "p" || k === "Escape") {
      e.preventDefault();
      if (k === "p" || !g.paused) setPaused(!g.paused);
      return;
    }
    if (g.paused) {
      if (confirmKey) {
        e.preventDefault();
        setPaused(false);
      }
      return;
    }
    if (k in KEY_OPTION) {
      e.preventDefault();
      choose(KEY_OPTION[k]);
    } else if (confirmKey) {
      e.preventDefault();
    }
    return;
  }

  if (!confirmKey) return;
  const tag = e.target && e.target.tagName;
  if (tag === "BUTTON" || tag === "SELECT" || tag === "INPUT" || tag === "A") return; // native handling
  if (g.screen === "result") {
    e.preventDefault();
    continueFromResult();
  } else if (g.screen === "welcome") {
    e.preventDefault();
    $("#welcome-form").requestSubmit();
  }
});

document.addEventListener("visibilitychange", () => {
  if (document.hidden && g.screen === "play" && !g.paused && g.phase !== "result") setPaused(true);
});

/* ---------------------------------------------------------------- boot */

function initThemes() {
  if (THEMES.length >= 2) {
    el.themePicker.hidden = false;
    for (const t of THEMES) {
      const o = document.createElement("option");
      o.value = t.id;
      o.textContent = t.name;
      el.themeSelect.appendChild(o);
    }
    el.themeSelect.addEventListener("change", () => {
      applyTheme(THEMES.find((t) => t.id === el.themeSelect.value) || THEMES[0]);
    });
  }
  applyTheme(THEMES[0]);
}

$$("[data-count]").forEach((n) => {
  n.textContent = LANGS[n.dataset.count].entries.length.toLocaleString("en-US");
});
$$("[data-game-title]").forEach((n) => (n.textContent = GAME_TITLE));

initThemes();
resizeScene();
renderHud(true);
requestAnimationFrame(frame);

// Small hook for automated checks; the game does not depend on it.
window.WordRain = { g, LANGS, MODES, buildQuestion, CONFIG };

</script>
